version: '3.8'

services:

  postgres:
    image: postgres:16
    container_name: hrms-postgres

    environment:
      POSTGRES_DB: hrms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

  redis:
    image: redis:7
    container_name: hrms-redis

    ports:
      - "6379:6379"